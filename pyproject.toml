[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slice"
version = "0.1.0"
description = "Human-structure understanding engine: image to pose to statistical body estimation to Knowledge JSON"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "shizukutanaka" },
]
dependencies = []

[project.scripts]
slice = "slice.__main__:main"

[tool.setuptools]
packages = ["slice"]

[tool.setuptools.package-data]
slice = ["viewer.html"]
