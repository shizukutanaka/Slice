<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Slice — 人体理解ビューア</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; font-family: system-ui, sans-serif; }
  body { display: flex; height: 100vh; background: #14161a; color: #e8e8ea; }
  #drop { flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; }
  #drop.drag { outline: 3px dashed #4a90ff; outline-offset: -12px; }
  #hint { color: #777; font-size: 15px; text-align: center; line-height: 2; }
  canvas { max-width: 100%; max-height: 100%; }
  #side { width: 300px; background: #1c1f26; padding: 14px; overflow-y: auto;
    border-left: 1px solid #2a2e38; font-size: 13px; }
  h1 { font-size: 16px; margin-bottom: 8px; }
  h2 { font-size: 12px; color: #8ab; margin: 14px 0 6px; text-transform: uppercase; }
  .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .tag { padding: 1px 6px; border-radius: 4px; font-size: 11px; }
  .obs { background: #123a6e; color: #7db4ff; }
  .pred { background: #6e3f12; color: #ffb35c; }
  button { width: 100%; margin-top: 10px; padding: 8px; background: #2f6fdb;
    color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:disabled { background: #333; }
  .leg { margin-top: 10px; font-size: 12px; color: #999; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 6px; vertical-align: -1px; }
  #info { font-size: 12px; color: #aaa; margin-top: 4px; min-height: 3.4em; }
  #warnings .warn { font-size: 12px; color: #ffb84d; }
  label { display: block; margin-top: 10px; font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<div id="drop">
  <div id="hint">画像をドラッグ＆ドロップ<br>または クリックして選択<br>
    <small>PNG / BMP（JPEG・WebPは Pillow 導入時）</small></div>
  <canvas id="cv" hidden></canvas>
</div>
<div id="side">
  <h1>Slice</h1>
  <div id="info">未解析</div>
  <div id="warnings"></div>
  <h2>Style</h2><div id="style">—</div>
  <h2>Body Model</h2><div id="model">—</div>
  <h2>Ratios</h2><div id="ratios">—</div>
  <h2>Joints</h2><div id="joints">—</div>
  <label><input type="checkbox" id="showPred" checked> 推定関節を表示</label>
  <button id="save" disabled>Knowledgeとして保存</button>
  <div class="leg">
    <span class="sw" style="background:#1e78ff"></span>Observed（観測）<br>
    <span class="sw" style="background:#ff9600"></span>Predicted（推定）
  </div>
</div>
<input id="file" type="file" accept="image/*" hidden>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const drop = document.getElementById('drop'), hint = document.getElementById('hint');
const file = document.getElementById('file');
let doc = null, img = new Image(), imgURL = null, lastBlob = null;

drop.onclick = () => file.click();
file.onchange = () => file.files[0] && analyze(file.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
drop.ondragleave = () => drop.classList.remove('drag');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('drag');
  e.dataTransfer.files[0] && analyze(e.dataTransfer.files[0]); };
document.getElementById('showPred').onchange = draw;
document.getElementById('save').onclick = save;

async function analyze(blob) {
  lastBlob = blob;
  document.getElementById('info').textContent = '解析中…';
  const res = await fetch('/analyze', { method: 'POST', body: blob,
    headers: {'X-Image-Name': blob.name || ''} });
  doc = await res.json();
  if (doc.error) { document.getElementById('info').textContent = doc.error; return; }
  if (imgURL) URL.revokeObjectURL(imgURL);
  imgURL = URL.createObjectURL(blob);
  img.onload = draw;
  img.src = imgURL;
  render_side();
  document.getElementById('save').disabled = false;
}

function showPred() { return document.getElementById('showPred').checked; }

function draw() {
  if (!doc || !img.width) return;
  const f = doc.skeleton.frame;
  cv.width = img.width; cv.height = img.height;
  cv.hidden = false; hint.hidden = true;
  ctx.drawImage(img, 0, 0);
  const kx = img.width / f.width, ky = img.height / f.height;
  const J = doc.skeleton.joints, pred = showPred();
  ctx.lineWidth = Math.max(2, img.width / 250);
  for (const [a, b] of doc.skeleton.bones) {
    const ja = J[a], jb = J[b]; if (!ja || !jb) continue;
    if (!pred && (ja.state !== 'observed' || jb.state !== 'observed')) continue;
    ctx.strokeStyle = (ja.state === 'observed' && jb.state === 'observed')
      ? '#1e78ff' : '#ff9600';
    ctx.beginPath(); ctx.moveTo(ja.x*kx, ja.y*ky); ctx.lineTo(jb.x*kx, jb.y*ky);
    ctx.stroke();
  }
  for (const [n, j] of Object.entries(J)) {
    if (!pred && j.state !== 'observed') continue;
    ctx.fillStyle = j.state === 'observed' ? '#1e78ff' : '#ff9600';
    ctx.beginPath(); ctx.arc(j.x*kx, j.y*ky, Math.max(3, img.width/180),
      0, 7); ctx.fill();
  }
}

function render_side() {
  const J = doc.skeleton.joints;
  const obs = Object.values(J).filter(j=>j.state==='observed').length;
  const prd = Object.values(J).filter(j=>j.state==='predicted').length;
  const poseTxt = doc.pose && doc.pose.label
    ? ` — ${doc.pose.label} (${Math.round((doc.pose.confidence||0)*100)}%)` : '';
  document.getElementById('info').textContent =
    `${obs} observed / ${prd} predicted — facing: ` +
    `${doc.skeleton.orientation.facing || '?'}${poseTxt}`;
  // doc.warnings carry the thin-evidence codes the pipeline emitted
  // (unknown_body_model, no_observed_torso, few_observed, ...) — a doc
  // with caveats must not render identically to a clean one
  const warns = doc.warnings || [];
  // textContent, not innerHTML: warnings come from the stored doc
  const wbox = document.getElementById('warnings');
  wbox.replaceChildren(...warns.map(w => {
    const el = document.createElement('div');
    el.className = 'row warn';
    el.textContent = String(w);
    return el;
  }));
  const st = doc.style || {};
  document.getElementById('style').innerHTML =
    `<div class="row"><span>${st.label||'—'}</span>` +
    `<span class="tag pred">推定 ${Math.round((st.confidence||0)*100)}%</span></div>`;
  const bm = doc.skeleton.body_model;
  document.getElementById('model').innerHTML =
    `<div class="row"><span>${bm.label||bm.name||'—'}</span>` +
    `<span class="tag pred">推定 ${Math.round((bm.confidence||0)*100)}%</span></div>`;
  const R = doc.ratio || {};
  document.getElementById('ratios').innerHTML =
    ['head_to_body','shoulder_width','hip_width','torso_length',
     'arm_l','arm_r','leg_l','leg_r','arm_span','leg_to_torso',
     'limb_symmetry']
    .filter(k => R[k] != null)
    .map(k => `<div class="row"><span>${k}</span><b>${R[k]}</b></div>`).join('');
  // basis = the audit string saying why each joint sits where it does
  document.getElementById('joints').innerHTML = Object.entries(J)
    .map(([n,j]) => `<div class="row" title="${(j.basis||'').replace(/"/g,'')}">` +
      `<span>${n}</span>` +
      `<span class="tag ${j.state==='observed'?'obs':'pred'}">` +
      `${Math.round(j.confidence*100)}%</span></div>`).join('');
}

async function save() {
  if (!lastBlob) return;
  const res = await fetch('/analyze?save=1', { method: 'POST', body: lastBlob });
  const out = await res.json();
  document.getElementById('info').textContent = out.id
    ? `保存しました: ${out.id}` : (out.error || '保存失敗');
}
</script>
</body>
</html>
